<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Analytics</title>
    <style>
      /* pre-hydration frame only — the design system lives in src/styles.css */
      html { background: #f2f4f8; }
      @media (prefers-color-scheme: dark) { html { background: #0b0d12; } }
    </style>
  </head>
  <body>
    <div class="viz-root">
      <div class="shell">
        <header class="topbar">
          <div class="brand">
            <span class="mark" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <rect x="2" y="9" width="3" height="7" rx="1" fill="rgba(255,255,255,0.55)" />
                <rect x="7.5" y="5" width="3" height="11" rx="1" fill="rgba(255,255,255,0.8)" />
                <rect x="13" y="2" width="3" height="14" rx="1" fill="#fff" />
              </svg>
            </span>
            <div>
              <h1>Agent Analytics</h1>
              <div class="scope-note" id="scope-note">Connecting…</div>
            </div>
          </div>
          <div class="filters" role="toolbar" aria-label="Dashboard filters">
            <select id="f-range" aria-label="Time range">
              <option value="24">Last 24 hours</option>
              <option value="72">Last 3 days</option>
              <option value="168" selected>Last 7 days</option>
              <option value="720">Last 30 days</option>
              <option value="2160">Last 90 days</option>
            </select>
            <select id="f-agent" aria-label="Agent">
              <option value="">All agents</option>
            </select>
            <span class="status-note" id="status-note"></span>
          </div>
        </header>
      </div>
      <div class="pulse" id="pulse-wrap" hidden>
        <span class="pulse-label">Events</span>
        <div class="shell"><div id="pulse"></div></div>
      </div>
      <div class="shell">
        <nav class="tabs" role="tablist" aria-label="Dashboard views" id="tabs"></nav>
        <main id="view" aria-live="polite"></main>
        <footer class="foot"><span id="foot-note">BigQuery Agent Analytics</span></footer>
      </div>
      <div class="tooltip" id="tooltip" hidden></div>
    </div>
    <script type="module" src="/src/mcp-app.ts"></script>
  </body>
</html>
